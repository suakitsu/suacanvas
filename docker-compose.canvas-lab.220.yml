services:
  nova-canvas-runtime:
    image: picpilot220/nova-canvas:local-20260918
    container_name: picpilot220_canvas_nova_runtime
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 256
  nova-canvas-lab:
    container_name: picpilot220_canvas_nova
    cpus: 0.5
    mem_limit: 128m
    pids_limit: 128
  infinite-canvas-lab:
    container_name: picpilot220_canvas_infinite
    cpus: 0.5
    mem_limit: 128m
    pids_limit: 128

networks:
  default:
    name: picpilot220_canvas_net

volumes:
  picpilot_canvas_nova_data:
    name: picpilot220_canvas_nova_data
