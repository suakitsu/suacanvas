[package]
name = "picpilot"
version = "1.0.0"
description = "PicPilot AI Commerce Studio for Windows"
authors = ["PicPilot"]
edition = "2021"

[lib]
name = "picpilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
open = "5"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
url = "2"
