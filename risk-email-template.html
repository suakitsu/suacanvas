<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{subject}}</title>
</head>
<body style="margin:0;padding:0;background:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',Arial,sans-serif;color:#1f2937;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f5f7fb;padding:32px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellspacing="0" cellpadding="0" style="width:600px;max-width:92%;background:#ffffff;border:1px solid #e5e7eb;border-radius:8px;overflow:hidden;">
          <tr>
            <td style="padding:24px 28px;border-bottom:1px solid #eef2f7;">
              <div style="font-size:20px;font-weight:700;color:#111827;">PicPilot</div>
              <div style="font-size:13px;color:#6b7280;margin-top:4px;">平台风控通知</div>
            </td>
          </tr>
          <tr>
            <td style="padding:28px;">
              <h1 style="margin:0 0 18px;font-size:22px;line-height:1.35;color:#111827;">{{subject}}</h1>
              <div style="font-size:15px;line-height:1.9;color:#374151;white-space:pre-line;">{{content}}</div>
              <div style="margin-top:28px;padding:14px 16px;background:#f9fafb;border:1px solid #eef2f7;border-radius:6px;font-size:13px;line-height:1.7;color:#6b7280;">
                如果你认为这是误判，请联系 PicPilot 管理员处理。为保障平台安全与合规，请避免提交可能涉及侵权、敏感、违法或不适宜生成的内容。
              </div>
            </td>
          </tr>
          <tr>
            <td style="padding:18px 28px;background:#f9fafb;border-top:1px solid #eef2f7;font-size:12px;line-height:1.6;color:#9ca3af;">
              这是一封系统自动发送的通知邮件，请勿直接回复。
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
