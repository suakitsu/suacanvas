services:
  nova-canvas-runtime:
    image: picpilot/nova-canvas:3.1.3-picpilot-v1
    build:
      context: .
      dockerfile: canvas-lab/nova-picpilot.Dockerfile
    container_name: picpilot_canvas_nova_runtime
    restart: unless-stopped
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      NOVA_TASK_DB: backend/data/nova-tasks.sqlite
      NOVA_IMAGE_DIR: backend/data/nova-images
      NOVA_TASK_CONCURRENCY: 1
      NOVA_MAX_QUEUE_SIZE: 10
      PROMPT_GALLERY_MODE: 1
    expose:
      - "3000"
    volumes:
      - picpilot_canvas_nova_data:/app/backend/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 8

  nova-canvas-lab:
    image: nginx:alpine@sha256:e7257f1ef28ba17cf7c248cb8ccf6f0c6e0228ab9c315c152f9c203cd34cf6d1
    container_name: picpilot_canvas_nova
    restart: unless-stopped
    depends_on:
      nova-canvas-runtime:
        condition: service_healthy
    ports:
      - "${CANVAS_NOVA_BIND:-0.0.0.0}:${CANVAS_NOVA_PORT:-13110}:80"
    volumes:
      - ./canvas-lab/nova-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./canvas-lab/picpilot-canvas-bridge.js:/usr/share/nginx/picpilot-assets/picpilot-canvas-bridge.js:ro
      - ./canvas-lab/picpilot-canvas-brand.js:/usr/share/nginx/picpilot-assets/picpilot-canvas-brand.js:ro
      - ./canvas-lab/openimage-source.html:/usr/share/nginx/picpilot-assets/openimage-source.html:ro
      - ./canvas-source:/usr/share/nginx/picpilot-source:ro
      - ./canvas-lab/picpilot-canvas-manifest.json:/usr/share/nginx/picpilot-assets/picpilot-canvas-manifest.json:ro
      - ./openImage-ts/public/brand-picpilot-mark.png:/usr/share/nginx/picpilot-assets/picpilot-brand.png:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8

  infinite-canvas-lab:
    image: nginx:alpine@sha256:e7257f1ef28ba17cf7c248cb8ccf6f0c6e0228ab9c315c152f9c203cd34cf6d1
    container_name: picpilot_canvas_infinite
    restart: unless-stopped
    ports:
      - "${CANVAS_INFINITE_BIND:-0.0.0.0}:${CANVAS_INFINITE_PORT:-13111}:80"
    volumes:
      - ./canvas-dist/infinite:/usr/share/nginx/html:ro
      - ./canvas-lab/infinite-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./canvas-lab/picpilot-canvas-bridge.js:/usr/share/nginx/picpilot-assets/picpilot-canvas-bridge.js:ro
      - ./canvas-lab/picpilot-canvas-brand.js:/usr/share/nginx/picpilot-assets/picpilot-canvas-brand.js:ro
      - ./canvas-lab/openimage-source.html:/usr/share/nginx/picpilot-assets/openimage-source.html:ro
      - ./canvas-source:/usr/share/nginx/picpilot-source:ro
      - ./canvas-lab/picpilot-canvas-manifest.json:/usr/share/nginx/picpilot-assets/picpilot-canvas-manifest.json:ro
      - ./openImage-ts/public/brand-picpilot-mark.png:/usr/share/nginx/picpilot-assets/picpilot-brand.png:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8

volumes:
  picpilot_canvas_nova_data:
