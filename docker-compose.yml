services:
  postgres:
    image: postgres:16-alpine
    container_name: openimage_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate a private .env with scripts/init-local-env.py}
    volumes:
      - openimage_pg_data:/var/lib/postgresql/data
    networks: [openimage_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    container_name: openimage_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - openimage_redis_data:/data
    networks: [openimage_net]
  minio:
    image: quay.io/minio/minio:latest
    container_name: openimage_minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-openimage}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Generate a private .env with scripts/init-local-env.py}
    volumes:
      - openimage_minio_data:/data
    ports:
      - "${MINIO_API_PORT:-19000}:9000"
      - "${MINIO_CONSOLE_PORT:-19001}:9001"
    networks: [openimage_net]
  backend:
    build: { context: ./openImage }
    container_name: openimage_backend
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      minio: { condition: service_started }
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Generate a private .env with scripts/init-local-env.py}
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:?Generate a private .env with scripts/init-local-env.py}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      ADMIN_INVITE_CODE: ${ADMIN_INVITE_CODE}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER}
      STORAGE_LOCAL_BASE_PATH: ${STORAGE_LOCAL_BASE_PATH}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_REGION: ${MINIO_REGION}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_PATH_STYLE_ACCESS: ${MINIO_PATH_STYLE_ACCESS}
      MINIO_PUBLIC_READ: ${MINIO_PUBLIC_READ}
      PAYMENT_ENABLED: ${PAYMENT_ENABLED}
      OPENIMAGE_AFDIAN_ENABLED: ${OPENIMAGE_AFDIAN_ENABLED:-false}
      OPENIMAGE_AFDIAN_USER_ID: ${OPENIMAGE_AFDIAN_USER_ID:-}
      OPENIMAGE_AFDIAN_API_TOKEN: ${OPENIMAGE_AFDIAN_API_TOKEN:-}
      OPENIMAGE_AFDIAN_BASE_URL: ${OPENIMAGE_AFDIAN_BASE_URL:-https://www.ifdian.net}
      OPENIMAGE_AFDIAN_WEBHOOK_SECRET: ${OPENIMAGE_AFDIAN_WEBHOOK_SECRET:-}
      OPENIMAGE_AFDIAN_WEBHOOK_MAX_SKEW_SECONDS: ${OPENIMAGE_AFDIAN_WEBHOOK_MAX_SKEW_SECONDS:-300}
      GITHUB_LOGIN_ENABLED: ${GITHUB_LOGIN_ENABLED}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      USER_WEB_BASE_URL: ${USER_WEB_BASE_URL}
      OPENIMAGE_PAYMENT_PUBLIC_API_BASE_URL: ${OPENIMAGE_PAYMENT_PUBLIC_API_BASE_URL:-}
      OPENIMAGE_PAYMENT_USER_WEB_BASE_URL: ${OPENIMAGE_PAYMENT_USER_WEB_BASE_URL:-}
      TENCENT_SES_SECRET_ID: ${TENCENT_SES_SECRET_ID:-}
      TENCENT_SES_SECRET_KEY: ${TENCENT_SES_SECRET_KEY:-}
      TENCENT_SES_FROM_EMAIL: ${TENCENT_SES_FROM_EMAIL:-}
      TENCENT_SES_TEMPLATE_ID: ${TENCENT_SES_TEMPLATE_ID:-0}
      TENCENT_SES_NOTIFICATION_TEMPLATE_ID: ${TENCENT_SES_NOTIFICATION_TEMPLATE_ID:-0}
      TENCENT_SES_NOTIFICATION_TEMPLATE_SUBJECT_KEY: ${TENCENT_SES_NOTIFICATION_TEMPLATE_SUBJECT_KEY:-subject}
      TENCENT_SES_NOTIFICATION_TEMPLATE_CONTENT_KEY: ${TENCENT_SES_NOTIFICATION_TEMPLATE_CONTENT_KEY:-content}
      TENCENT_SES_REGION: ${TENCENT_SES_REGION:-ap-hongkong}
      TURNSTILE_ENABLED: ${TURNSTILE_ENABLED:-false}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_VERIFY_URL: ${TURNSTILE_VERIFY_URL:-https://challenges.cloudflare.com/turnstile/v0/siteverify}
      TURNSTILE_TIMEOUT_SECONDS: ${TURNSTILE_TIMEOUT_SECONDS:-5}
      TURNSTILE_BILLING_ENABLED: ${TURNSTILE_BILLING_ENABLED:-false}
      OPENIMAGE_AI_IMAGE_ENABLED: ${OPENIMAGE_AI_IMAGE_ENABLED}
      OPENIMAGE_AI_IMAGE_PROVIDER: ${OPENIMAGE_AI_IMAGE_PROVIDER}
      OPENIMAGE_AI_IMAGE_BASE_URL: ${OPENIMAGE_AI_IMAGE_BASE_URL}
      OPENIMAGE_AI_IMAGE_KEY: ${OPENIMAGE_AI_IMAGE_KEY}
      OPENIMAGE_AI_IMAGE_MODEL: ${OPENIMAGE_AI_IMAGE_MODEL}
      OPENIMAGE_AI_IMAGE_SIZE: ${OPENIMAGE_AI_IMAGE_SIZE}
      OPENIMAGE_AI_IMAGE_RESPONSE_FORMAT: ${OPENIMAGE_AI_IMAGE_RESPONSE_FORMAT}
      OPENIMAGE_AI_IMAGE_ACTUAL_COST: ${OPENIMAGE_AI_IMAGE_ACTUAL_COST}
      OPENIMAGE_AI_IMAGE_PUBLIC_BASE_URL: ${OPENIMAGE_AI_IMAGE_PUBLIC_BASE_URL}
      OPENIMAGE_AI_IMAGE_TIMEOUT_SECONDS: ${OPENIMAGE_AI_IMAGE_TIMEOUT_SECONDS}
      OPENIMAGE_AI_WORKER_PUBLIC_BASE_URL: ${OPENIMAGE_AI_WORKER_PUBLIC_BASE_URL:-${OPENIMAGE_AI_IMAGE_PUBLIC_BASE_URL:-}}
      OPENIMAGE_AI_WORKER_TOKEN_PEPPER: ${OPENIMAGE_AI_WORKER_TOKEN_PEPPER:-}
      OPENIMAGE_AI_WORKER_SIGNING_SECRET: ${OPENIMAGE_AI_WORKER_SIGNING_SECRET:-}
      OPENIMAGE_AI_WORKER_HEARTBEAT_OFFLINE_SECONDS: ${OPENIMAGE_AI_WORKER_HEARTBEAT_OFFLINE_SECONDS:-60}
      OPENIMAGE_AI_WORKER_INPUT_URL_TTL_SECONDS: ${OPENIMAGE_AI_WORKER_INPUT_URL_TTL_SECONDS:-300}
      OPENIMAGE_AI_WORKER_MAX_ARTIFACT_BYTES: ${OPENIMAGE_AI_WORKER_MAX_ARTIFACT_BYTES:-26214400}
      OPENIMAGE_AI_WORKER_LEASE_GRACE_SECONDS: ${OPENIMAGE_AI_WORKER_LEASE_GRACE_SECONDS:-15}
      XIN_ZHI_ZHU_API_KEY: ${XIN_ZHI_ZHU_API_KEY:-}
      OPENIMAGE_XIN_ZHI_ZHU_API_KEY: ${OPENIMAGE_XIN_ZHI_ZHU_API_KEY:-}
      AISHUCH_API_KEY: ${AISHUCH_API_KEY:-}
      OPENIMAGE_AISHUCH_API_KEY: ${OPENIMAGE_AISHUCH_API_KEY:-}
      OPENIMAGE_YUNFEI_1K_API_KEY: ${OPENIMAGE_YUNFEI_1K_API_KEY:-}
      OPENIMAGE_YUNFEI_HIRES_API_KEY: ${OPENIMAGE_YUNFEI_HIRES_API_KEY:-}
      RUA_CHAT_API_KEY: ${RUA_CHAT_API_KEY:-}
      OPENIMAGE_RUA_CHAT_API_KEY: ${OPENIMAGE_RUA_CHAT_API_KEY:-}
      OPENIMAGE_IMAGE_WORKER_CONCURRENCY: ${OPENIMAGE_IMAGE_WORKER_CONCURRENCY:-10}
      OPENIMAGE_YUNFEI_1K_CONCURRENCY: ${OPENIMAGE_YUNFEI_1K_CONCURRENCY:-10}
      OPENIMAGE_YUNFEI_HIRES_CONCURRENCY: ${OPENIMAGE_YUNFEI_HIRES_CONCURRENCY:-10}
      OPENIMAGE_RUA_CHAT_CONCURRENCY: ${OPENIMAGE_RUA_CHAT_CONCURRENCY:-2}
      OPENIMAGE_XIN_ZHI_ZHU_CONCURRENCY: ${OPENIMAGE_XIN_ZHI_ZHU_CONCURRENCY:-10}
      VIDEO_MOCK_ENABLED: ${VIDEO_MOCK_ENABLED:-false}
      VIDEO_PAID_PROVIDER_ENABLED: ${VIDEO_PAID_PROVIDER_ENABLED:-false}
      VIDEO_AGNES_ENABLED: ${VIDEO_AGNES_ENABLED:-false}
      APIMART_API_KEY: ${APIMART_API_KEY:-}
      APIMART_CREDIT_CNY_RATE: ${APIMART_CREDIT_CNY_RATE:-0.679110}
      APIMART_USD_CNY_RATE: ${APIMART_USD_CNY_RATE:-6.791100}
      AGNES_API_KEY: ${AGNES_API_KEY:-}
      HFSY_API_KEY: ${HFSY_API_KEY:-}
      VIDEO_CONFIG_ENCRYPTION_KEY: ${VIDEO_CONFIG_ENCRYPTION_KEY:-}
      VIDEO_PUBLIC_BASE_URL: ${VIDEO_PUBLIC_BASE_URL:-${OPENIMAGE_AI_IMAGE_PUBLIC_BASE_URL:-}}
      APIMART_WEBHOOK_SECRET: ${APIMART_WEBHOOK_SECRET:-}
      VIDEO_TASK_TIMEOUT_MINUTES: ${VIDEO_TASK_TIMEOUT_MINUTES:-30}
      VIDEO_WORKER_BATCH_SIZE: ${VIDEO_WORKER_BATCH_SIZE:-20}
      VIDEO_WORKER_POLL_INTERVAL_MS: ${VIDEO_WORKER_POLL_INTERVAL_MS:-3000}
      OPENIMAGE_AI_TEXT_DEEPSEEK_ENABLED: ${OPENIMAGE_AI_TEXT_DEEPSEEK_ENABLED:-false}
      OPENIMAGE_AI_TEXT_DEEPSEEK_BASE_URL: ${OPENIMAGE_AI_TEXT_DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      OPENIMAGE_AI_TEXT_DEEPSEEK_KEY: ${OPENIMAGE_AI_TEXT_DEEPSEEK_KEY:-}
      OPENIMAGE_AI_TEXT_DEEPSEEK_MODEL: ${OPENIMAGE_AI_TEXT_DEEPSEEK_MODEL:-deepseek-v4-flash}
      OPENIMAGE_ASSISTANT_ENABLED: ${OPENIMAGE_ASSISTANT_ENABLED:-false}
      OPENIMAGE_ASSISTANT_BASE_URL: ${OPENIMAGE_ASSISTANT_BASE_URL:-https://api.openai.com}
      OPENIMAGE_ASSISTANT_API_KEY: ${OPENIMAGE_ASSISTANT_API_KEY:-}
      OPENIMAGE_ASSISTANT_API_KEYS: ${OPENIMAGE_ASSISTANT_API_KEYS:-}
      OPENIMAGE_ASSISTANT_MODEL: ${OPENIMAGE_ASSISTANT_MODEL:-gpt-5.5}
      OPENIMAGE_ASSISTANT_MAX_INPUT_CHARS: ${OPENIMAGE_ASSISTANT_MAX_INPUT_CHARS:-3000}
      OPENIMAGE_ASSISTANT_MAX_HISTORY_MESSAGES: ${OPENIMAGE_ASSISTANT_MAX_HISTORY_MESSAGES:-12}
      OPENIMAGE_ASSISTANT_MAX_TOKENS: ${OPENIMAGE_ASSISTANT_MAX_TOKENS:-900}
      OPENIMAGE_ASSISTANT_TEMPERATURE: ${OPENIMAGE_ASSISTANT_TEMPERATURE:-0.35}
      OPENIMAGE_ASSISTANT_TIMEOUT_SECONDS: ${OPENIMAGE_ASSISTANT_TIMEOUT_SECONDS:-45}
      OPENIMAGE_OTOKAPI_BASE_URL: ${OPENIMAGE_OTOKAPI_BASE_URL:-https://otokapi.com}
      OPENIMAGE_OTOKAPI_API_KEY: ${OPENIMAGE_OTOKAPI_API_KEY:-}
      OPENIMAGE_OTOKAPI_API_KEYS: ${OPENIMAGE_OTOKAPI_API_KEYS:-}
      OPENIMAGE_OTOKAPI_MODEL: ${OPENIMAGE_OTOKAPI_MODEL:-gpt-5.5}
      OPENIMAGE_OTOKAPI_TIMEOUT_SECONDS: ${OPENIMAGE_OTOKAPI_TIMEOUT_SECONDS:-60}
      OTOKAPI_API_KEY: ${OTOKAPI_API_KEY:-}
    ports: ["${BACKEND_PORT}:8080"]
    volumes: [openimage_storage:/app/data/storage]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/public/ping >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
    networks: [openimage_net]
  user-web:
    build:
      context: ./openImage-ts
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_TURNSTILE_BILLING_ENABLED: ${NEXT_PUBLIC_TURNSTILE_BILLING_ENABLED:-false}
        NEXT_PUBLIC_CANVAS_LAB_ENABLED: ${NEXT_PUBLIC_CANVAS_LAB_ENABLED:-false}
        NEXT_PUBLIC_CANVAS_NOVA_URL: ${NEXT_PUBLIC_CANVAS_NOVA_URL:-}
        NEXT_PUBLIC_CANVAS_INFINITE_URL: ${NEXT_PUBLIC_CANVAS_INFINITE_URL:-}
    container_name: openimage_user_web
    restart: unless-stopped
    depends_on:
      backend: { condition: service_healthy }
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      NEXT_PUBLIC_TURNSTILE_BILLING_ENABLED: ${NEXT_PUBLIC_TURNSTILE_BILLING_ENABLED:-false}
      NEXT_PUBLIC_CANVAS_LAB_ENABLED: ${NEXT_PUBLIC_CANVAS_LAB_ENABLED:-false}
      NEXT_PUBLIC_CANVAS_NOVA_URL: ${NEXT_PUBLIC_CANVAS_NOVA_URL:-}
      NEXT_PUBLIC_CANVAS_INFINITE_URL: ${NEXT_PUBLIC_CANVAS_INFINITE_URL:-}
      BACKEND_INTERNAL_BASE_URL: ${BACKEND_INTERNAL_BASE_URL:-http://backend:8080}
      PORT: 3000
    ports: ["${USER_WEB_PORT}:3000"]
    networks: [openimage_net]
  admin-web:
    build:
      context: ./openImage-admin-ts
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    container_name: openimage_admin_web
    restart: unless-stopped
    depends_on:
      backend: { condition: service_healthy }
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      BACKEND_INTERNAL_BASE_URL: ${BACKEND_INTERNAL_BASE_URL:-http://backend:8080}
      PORT: 3001
    ports: ["${ADMIN_WEB_PORT}:3001"]
    networks: [openimage_net]
networks:
  openimage_net: { name: openimage_net }
volumes:
  openimage_pg_data:
  openimage_redis_data:
  openimage_minio_data:
  openimage_storage:
